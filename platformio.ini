; MF26 companion robot - ESP32-C6
;   Pin assignments live in src/config.h

[env:esp32-c6-devkitc-1]
; official platformio/platform-espressif32 has no arduino framework for C6;
; pioarduino's fork keeps that current, see
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Actually a C6 Super Mini - there is no board definition for it, and the
; DevKitC-1 one is close enough (all pins are set explicitly in src/config.h),
; but it declares 8MB of flash where the Super Mini has 4MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; 3MB app partition - the default 1.25MB is not enough for the face
; customiser and the API docs. No OTA, which we do not use.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7
    esp32async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.2.0
